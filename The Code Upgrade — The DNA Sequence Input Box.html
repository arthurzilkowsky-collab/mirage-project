    <h3 style="margin: 0 0 8px 0; font-size: 0.85rem; color: #38bdf8; letter-spacing: 1px;">Genetic Codon Stream</h3>
    <input type="text" id="dnaInput" value="ATGCGATCGATCGTACGGAT" style="background: #02040a; border: 1px solid #475569; color: #38bdf8; padding: 6px; border-radius: 4px; font-family: monospace; width: 180px; font-size: 0.75rem;" />
    <button onclick="applyDNASeed()" style="margin-top: 8px; width: 100%; padding: 5px; font-size: 0.75rem; border-radius: 10px;">Morph Tunnel to DNA</button>
</div>

<script>
    function translateDNAtoMelody(dnaString) {
        const baseMap = { 'A': 0, 'T': 3, 'C': 7, 'G': 10 };
        let intervals = [];
        for (let i = 0; i < dnaString.length; i += 3) {
            let codon = dnaString.substr(i, 3).toUpperCase();
            let base = codon[0];
            if (baseMap[base] !== undefined) {
                intervals.push(baseMap[base]);
            }
        }
        return intervals.length > 0 ? intervals : [0, 3, 7, 10]; // fallback
    }

</script>
